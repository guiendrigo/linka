schema: spec-driven

context: |
  Production is the Magalu VM at /opt/linka: Docker Compose project `linka`,
  SQLite file in volume `linka_linka-data`, Caddy in the OpenReply stack
  (`/opt/openreply/Caddyfile`). Keep `deploy/Caddyfile` in sync with that file.
  `npm run build` (Vercel/Nitro) is not the production gate — `docker compose
  -p linka build` is. Do not run `npm run dev` on the VM while host `.env` sets
  `SQLITE_PATH` to `/data/...`; that path exists only inside the container.
  Schema changes need both `migrations/*.sql` (Postgres/PGLite) and
  `migrations/sqlite/*.sql`. Never apply Postgres files to SQLite. Supply
  timestamps from JavaScript; SQLite booleans are 0/1.
  `npm test` is the Grok template suite and fails on purpose. Linka tests are
  `npm run test:linka`. Archive completed OpenSpec changes so main specs
  accumulate; do not pile complete changes under `openspec/changes/`.

rules:
  proposal:
    - Always state what is out of scope.
    - If the change ships on Magalu, say so; do not treat Vercel preview as prod.
  design:
    - Schema work must name both migration trees and the next file numbers.
  tasks:
    - Each task states how to verify it.
    - Changes that ship on Magalu include docker compose build/up and a public
      URL smoke, not only `npm run typecheck` / `npm run build`.

operations:
  apply:
    guidance:
      - Done means `npm run test:linka`, typecheck, and lint. Magalu-bound work
        also needs `docker compose -p linka build` (or up --build).
      - Do not use `npm test` as a verdict.
  archive:
    guidance:
      - Sync delta specs into `openspec/specs/` before moving the change.
      - Do not leave a complete change sitting in `openspec/changes/`.
